name: mdlr linux smoke test

# Smoke-test the Linux builds of mdlr that this tap ships. The mdlr binary is
# dynamically linked against its libc, so this confirms it actually loads and
# runs `-h` on the matching runtime: glibc directly on the runner, musl inside
# an Alpine container. macOS builds are covered by the cask.

on:
  push:
    paths:
      - 'Casks/mdlr.rb'
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            libc: glibc
            suffix: linux_amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            libc: glibc
            suffix: linux_arm64
          - runner: ubuntu-latest
            arch: amd64
            libc: musl
            suffix: linux_amd64_musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            libc: musl
            suffix: linux_arm64_musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from cask
        id: ver
        run: |
          version=$(grep -oE 'version "[^"]+"' Casks/mdlr.rb | head -1 | sed -E 's/version "([^"]+)"/\1/')
          if [ -z "$version" ]; then
            echo "Could not parse version from Casks/mdlr.rb" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing mdlr $version on linux/${{ matrix.arch }} (${{ matrix.libc }})"

      - name: Download and extract tarball
        run: |
          v="${{ steps.ver.outputs.version }}"
          url="https://github.com/thempatel/mdlr/releases/download/v${v}/mdlr_${v}_${{ matrix.suffix }}.tar.gz"
          echo "Fetching $url"
          curl -fsSL "$url" -o mdlr.tar.gz
          mkdir -p out
          tar xzf mdlr.tar.gz -C out
          chmod +x out/mdlr out/mdlr-extract-go
          ls -l out

      - name: Verify mdlr -h works
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then
            # musl binary needs a musl runtime, so run it inside Alpine.
            docker run --rm -v "$PWD/out":/out -w /out alpine:latest ./mdlr -h | tee help.txt
          else
            out/mdlr -h | tee help.txt
          fi
          test -s help.txt

      - name: Verify mdlr-extract-go compiled
        run: |
          # Statically-linked Go binary, so a header check is enough and is
          # libc/arch-independent.
          file out/mdlr-extract-go | grep -q ELF
